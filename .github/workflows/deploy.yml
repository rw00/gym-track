name: Build and Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    DOCKER_IMAGE_NAME: gym-track-app
    DOCKER_IMAGE_VERSION: latest

jobs:
    build:
        runs-on: ubuntu-latest
        environment: prod

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}

            - name: Pull and run Docker image on server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  password: ${{ secrets.SERVER_PASSWORD }}
                  script: |
                      docker rm -f ${{ env.DOCKER_IMAGE_NAME }}
                      docker rmi -f $(docker images -q "${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}")
                      echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
                      docker run --restart=always --name "${{ env.DOCKER_IMAGE_NAME }}" -d \
                        -p 3000:3000 \
                        --volume ${PWD}/${{ env.DOCKER_IMAGE_NAME }}:/app-data \
                        -e DB_PATH="/app-data/db.json" \
                        -e TIMEZONE="${{ secrets.TIMEZONE }}" \
                        -e ADMIN_USER="${{ secrets.ADMIN_USER }}" \
                        -e ADMIN_PASS="${{ secrets.ADMIN_PASS }}" \
                        -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
                        ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}
